<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Tracker</title>
    <style>
        :root {
            color-scheme: light dark;
            --accent: #2f6feb;
            --muted: #6b7280;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f6fb;
            color: #111827;
            display: flex;
            justify-content: center;
        }

        main {
            width: min(720px, 100%);
            padding: 40px 20px 60px;
        }

        header h1 {
            margin: 0 0 4px;
            font-size: 28px;
        }

        header p {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 14px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
        }

        button.ghost {
            background: transparent;
            color: var(--muted);
            padding: 6px 8px;
            font-size: 13px;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 16px;
        }

        li.done .title {
            text-decoration: line-through;
            color: var(--muted);
        }

        .title {
            flex: 1;
            word-break: break-word;
        }

        .id {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .empty {
            color: var(--muted);
            font-size: 14px;
            padding: 18px 0;
        }

        footer {
            margin-top: 28px;
            font-size: 12px;
            color: var(--muted);
        }

        code {
            background: #e9edf6;
            padding: 2px 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>Task Tracker</h1>
        <p>Учебный REST-сервис: сборка и деплой через GitHub Actions &rarr; GHCR</p>
    </header>

    <form id="create-form">
        <input id="title" type="text" placeholder="Что нужно сделать?" required maxlength="200">
        <button type="submit">Добавить</button>
    </form>

    <ul id="tasks"></ul>
    <div id="empty" class="empty" hidden>Пока нет задач. Добавьте первую.</div>

    <footer>
        API: <code>GET /api/tasks</code>, <code>POST /api/tasks</code>,
        <code>PATCH /api/tasks/{id}</code>, <code>DELETE /api/tasks/{id}</code>,
        <code>GET /actuator/health</code>
    </footer>
</main>

<script>
    const api = '/api/tasks';
    const list = document.getElementById('tasks');
    const empty = document.getElementById('empty');

    async function loadTasks() {
        const response = await fetch(api);
        const tasks = await response.json();
        list.replaceChildren(...tasks.map(renderTask));
        empty.hidden = tasks.length > 0;
    }

    function renderTask(task) {
        const item = document.createElement('li');
        item.className = task.done ? 'done' : '';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.title = 'Отметить как выполненную';
        checkbox.addEventListener('change', async () => {
            await fetch(`${api}/${task.id}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({done: checkbox.checked})
            });
            await loadTasks();
        });

        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = task.title;

        const id = document.createElement('span');
        id.className = 'id';
        id.textContent = '#' + task.id;

        const remove = document.createElement('button');
        remove.className = 'ghost';
        remove.textContent = 'Удалить';
        remove.addEventListener('click', async () => {
            await fetch(`${api}/${task.id}`, {method: 'DELETE'});
            await loadTasks();
        });

        item.append(checkbox, title, id, remove);
        return item;
    }

    document.getElementById('create-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const input = document.getElementById('title');
        await fetch(api, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title: input.value})
        });
        input.value = '';
        await loadTasks();
    });

    loadTasks();
</script>
</body>
</html>
